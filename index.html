<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Owl</title>
<meta name="theme-color" content="#8ccbef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Owl">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { background: var(--page); -webkit-text-size-adjust: 100%; }
body { margin: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one rounded "device" card. Header (name, stage, mood, acorns), a sky scene that follows the real clock with the owl, its nest decor and speech bubble, need meters, five care buttons, and bottom sheets for everything else. */
:root {
  --page: #eaf5fc;
  --card: #ffffff;
  --ink: #23374c;
  --muted: #5d7287;
  --line: #d6e8f4;
  --butter: #ffe68f;
  --butter-deep: #f4c94a;
  --low: #f39a7e;
  --good: #7cc48a;
  --pink: #ff9fb4;
  --mint: #9fe0c4;
  --sky: #bfe3f7;
  --sky-deep: #8ccbef;
  --dawn-top: #f6bfa6;
  --dawn-low: #fde7b9;
  --dusk-top: #7f86c8;
  --dusk-low: #f6b98c;
  --night: #233b5e;
  --night-deep: #162842;
  --cloud: #ffffff;
  --owl: #f8d96f;
  --owl-wing: #e9bf4f;
  --owl-belly: #fff6d6;
  --owl-line: #d9a83a;
  --beak: #f39b4a;
  --blush: #ffb2a6;
  --eye: #2a3446;
  --leaf: #7cbf7a;
  --wood: #b98a57;
  --display: "Sniglet", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0f1d30; --card: #172a43; --ink: #eaf4fb; --muted: #a3bad0; --line: #284262;
  --sky: #3a6f9e; --sky-deep: #2b5a85; --cloud: #c9e3f5; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --page: #0f1d30; --card: #172a43; --ink: #eaf4fb; --muted: #a3bad0; --line: #284262;
  --sky: #3a6f9e; --sky-deep: #2b5a85; --cloud: #c9e3f5; color-scheme: dark;
}
body {
  background: var(--page); color: var(--ink); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
button { font-family: var(--body); color: inherit; }
.device {
  max-width: 440px; margin: 0 auto; background: var(--card);
  border: 2px solid var(--line); border-radius: 32px;
  padding: 16px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden;
}
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 2px 4px 0; }
.who { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.8rem; line-height: 1.05; margin: 0; text-wrap: balance; }
.age { color: var(--muted); font-size: .85rem; font-weight: 700; }
.chips { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.mood { font-weight: 800; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; background: var(--butter); color: #4a3a08; }
.mood.sad { background: var(--low); color: #4a1d10; }
.mood.sleep { background: var(--night); color: #e8f1ff; }
.acorns { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: .9rem; font-variant-numeric: tabular-nums; }
.acorns svg { width: 18px; height: 18px; }

/* scene */
.scene {
  position: relative; aspect-ratio: 1 / 0.9; max-width: 100%; border-radius: 24px; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-deep), var(--sky) 72%);
  transition: background .8s ease; user-select: none; -webkit-user-select: none;
}
.scene.dawn { background: linear-gradient(180deg, var(--dawn-top), var(--dawn-low) 75%); }
.scene.dusk { background: linear-gradient(180deg, var(--dusk-top), var(--dusk-low) 80%); }
.scene.night, .scene.asleep { background: linear-gradient(180deg, var(--night-deep), var(--night) 75%); }
.cloud { position: absolute; background: var(--cloud); border-radius: 999px; opacity: .85; transition: opacity .8s; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
.cloud::before { width: 55%; height: 160%; left: 15%; bottom: 20%; }
.cloud::after { width: 40%; height: 130%; right: 12%; bottom: 25%; }
.c1 { width: 80px; height: 20px; top: 14%; left: 8%; animation: drift 30s linear infinite alternate; }
.c2 { width: 60px; height: 16px; top: 30%; right: 6%; animation: drift 24s linear infinite alternate-reverse; }
.night .cloud, .asleep .cloud { opacity: .12; }
.dusk .cloud { opacity: .5; }
@keyframes drift { to { transform: translateX(30px); } }
.stars { position: absolute; inset: 0; opacity: 0; transition: opacity .8s; }
.night .stars, .asleep .stars { opacity: 1; }
.dusk .stars { opacity: .35; }
.stars i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--butter); animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .3; } }
.moon { position: absolute; top: 8%; right: 10%; width: 34px; height: 34px; border-radius: 50%; box-shadow: -8px 4px 0 0 var(--butter); transform: rotate(-20deg); opacity: 0; transition: opacity .8s; }
.night .moon, .asleep .moon { opacity: 1; }
.sun { position: absolute; top: 8%; right: 11%; width: 38px; height: 38px; border-radius: 50%; background: var(--butter); box-shadow: 0 0 0 8px rgba(255,230,143,.35); transition: opacity .8s, top .8s; }
.dawn .sun, .dusk .sun { top: 36%; background: #ffc98a; box-shadow: 0 0 0 10px rgba(255,201,138,.35); }
.night .sun, .asleep .sun { opacity: 0; }
.ground { position: absolute; left: -10%; right: -10%; bottom: -30%; height: 46%; border-radius: 50%; background: var(--butter); opacity: .55; }
.night .ground, .asleep .ground { opacity: .18; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.decor { position: absolute; }
.decor svg { width: 100%; display: block; overflow: visible; }
.night .glow, .dusk .glow, .asleep .glow { filter: drop-shadow(0 0 6px rgba(255,230,143,.9)); }

.pet {
  position: absolute; left: 50%; bottom: 6%; width: 56%; max-width: 230px; transform: translateX(-50%);
  background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: width .8s ease;
}
.pet.st-egg { width: 46%; }
.pet.st-owlet { width: 40%; }
.pet.st-fledgling { width: 48%; }
.pet.st-adult { width: 56%; }
.pet.st-wise { width: 58%; }
.pet:focus-visible { outline: 3px solid var(--butter-deep); outline-offset: 4px; border-radius: 24px; }
.pet svg { width: 100%; display: block; overflow: visible; }
.bob { animation: bob 3s ease-in-out infinite; transform-origin: 100px 190px; }
.asleep .bob { animation: breathe 4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes breathe { 50% { transform: scale(1.025, .985); } }
.wiggle { animation: wiggle .55s ease; }
@keyframes wiggle { 25% { transform: rotate(-6deg); } 60% { transform: rotate(5deg); } }
.wing { transition: transform .25s ease; }
.flap .wl { transform: rotate(-22deg); } .flap .wr { transform: rotate(22deg); }
.wl { transform-origin: 50px 110px; } .wr { transform-origin: 150px 110px; }
.egg { animation: wobble 2.4s ease-in-out infinite; transform-origin: 100px 180px; }
@keyframes wobble { 0%,70%,100% { transform: rotate(0); } 78% { transform: rotate(-7deg); } 86% { transform: rotate(6deg); } 93% { transform: rotate(-3deg); } }

.gift { position: absolute; left: 12%; bottom: 7%; width: 15%; border: 0; background: none; padding: 0; cursor: pointer; z-index: 2; animation: hop 1.6s ease-in-out infinite; }
.gift svg { width: 100%; display: block; }
.gift:focus-visible { outline: 3px solid var(--butter-deep); outline-offset: 3px; border-radius: 8px; }
@keyframes hop { 0%,60%,100% { transform: translateY(0); } 75% { transform: translateY(-8px) rotate(-4deg); } }

.bubble {
  position: absolute; left: 50%; top: 6%; transform: translateX(-50%);
  width: max-content; max-width: 82%; background: var(--card); color: var(--ink);
  border: 2px solid var(--line); border-radius: 18px; padding: 10px 14px;
  font-weight: 800; font-size: .95rem; line-height: 1.35; text-align: center; text-wrap: balance; z-index: 3;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; background: var(--card); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.bubble.fresh { animation: popin .3s ease; }
@keyframes popin { from { transform: translateX(-50%) scale(.85); opacity: .3; } }

.checkin { position: absolute; left: 8%; right: 8%; top: 6%; z-index: 4; background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: popin2 .3s ease; }
@keyframes popin2 { from { transform: scale(.9); opacity: .3; } }
.checkin p { margin: 0; font-weight: 800; text-align: center; text-wrap: balance; }
.moodrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.moodrow button { border: 2px solid var(--line); background: var(--page); border-radius: 14px; padding: 8px 2px; font-weight: 800; font-size: .8rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.moodrow button i { width: 16px; height: 16px; border-radius: 50%; display: block; }

.float { position: absolute; pointer-events: none; font-weight: 800; font-size: 20px; z-index: 5; }
.heart { width: 22px; height: 22px; }
.zzz { position: absolute; font-family: var(--display); font-weight: 800; color: var(--butter); font-size: 1.4rem; pointer-events: none; }

/* meters */
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; padding: 0 4px; }
.meter { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.meter .top { display: flex; justify-content: space-between; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.meter .top b { font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: 0; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: inherit; background: var(--butter-deep); transition: width .6s ease, background .3s; }
.bar span.low { background: var(--low); }

/* actions */
.actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.act {
  font-weight: 800; font-size: .78rem; background: var(--page); border: 2px solid var(--line); border-radius: 18px;
  padding: 10px 2px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .12s, border-color .2s;
}
.act svg { width: 26px; height: 26px; }
.act:hover { border-color: var(--butter-deep); }
.act:active { transform: scale(.94); }
.act:disabled { opacity: .4; cursor: default; }
.act.on { background: var(--night); color: #eaf2ff; border-color: var(--night); }
button:focus-visible { outline: 3px solid var(--butter-deep); outline-offset: 2px; }

/* sheets */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--card); border-top: 2px solid var(--line); border-radius: 26px 26px 0 0;
  padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 -10px 30px rgba(20,40,70,.18); animation: up .25s ease;
}
@keyframes up { from { transform: translateY(30%); opacity: 0; } }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 1.25rem; font-weight: 800; }
.sheet h3 { margin: 4px 0 0; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; top: -16px; background: var(--card); padding-top: 2px; z-index: 1; }
.sheet .head div { display: flex; align-items: center; gap: 4px; min-width: 0; }
.ghost { font-weight: 800; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px 8px; border-radius: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip {
  text-align: left; cursor: pointer; background: var(--page); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.chip b { font-size: .95rem; }
.chip small { color: var(--muted); font-weight: 700; font-size: .78rem; }
.chip .tag { font-size: .72rem; font-weight: 800; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }
.chip.sel { border-color: var(--butter-deep); background: var(--butter); color: #3d3108; }
.chip.sel small, .chip.sel .tag { color: #6b5a1d; }
.chip:disabled { opacity: .5; cursor: default; }
.chip.tile { align-items: center; text-align: center; padding: 14px 6px; }
.chip.tile svg { width: 28px; height: 28px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--page); border: 2px solid var(--line); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 8px; font-weight: 800; cursor: pointer; }
.seg button.on { background: var(--card); box-shadow: 0 1px 4px rgba(20,40,70,.12); }
.note { margin: 0; color: var(--muted); font-size: .85rem; font-weight: 700; line-height: 1.45; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--page); }
.row span { font-weight: 800; }
.row button { flex: none; }
.pill { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 800; cursor: pointer; }
.pill.on { background: var(--butter); border-color: var(--butter-deep); color: #3d3108; }
.pill.warn { background: var(--low); border-color: var(--low); color: #4a1d10; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--page); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat small { color: var(--muted); font-size: .7rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.stat b { font-size: 1rem; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--line); display: block; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .75rem; font-weight: 700; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.timeline li:last-child { border-bottom: 0; }
.timeline i { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--butter-deep); }
.timeline .k-grow i { background: var(--good); } .timeline .k-gift i { background: var(--sky-deep); } .timeline .k-love i { background: var(--pink); } .timeline .k-play i { background: var(--dusk-top); }
.timeline div { display: flex; flex-direction: column; min-width: 0; }
.timeline b { font-size: .92rem; }
.timeline small { color: var(--muted); font-weight: 700; font-size: .75rem; }
.trinket { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border: 2px solid var(--line); border-radius: 14px; background: var(--page); text-align: center; min-width: 0; }
.trinket svg { width: 34px; height: 34px; }
.trinket b { font-size: .78rem; line-height: 1.2; }
.trinket small { font-size: .7rem; color: var(--muted); font-weight: 800; }
.trinket.missing { opacity: .5; }

/* games */
.game { position: absolute; inset: 0; z-index: 6; touch-action: none; }
.game.cover { background: inherit; }
.gamehud { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-variant-numeric: tabular-nums; z-index: 7; pointer-events: none; }
.gamehud span { background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 10px; border: 2px solid var(--line); }
.star { position: absolute; top: -40px; width: 42px; height: 42px; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.star svg, .moth svg, .bush svg, .player svg, .peek svg { width: 100%; height: 100%; display: block; overflow: visible; }
.moth { position: absolute; left: 0; top: 0; width: 34px; height: 26px; pointer-events: none; }
.player { position: absolute; bottom: 8px; width: 64px; height: 60px; margin-left: -32px; pointer-events: none; }
.pads { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%); width: min(78%, 280px); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pad { aspect-ratio: 1; max-width: 100%; border-radius: 26px; border: 4px solid rgba(255,255,255,.7); cursor: pointer; opacity: .55; transition: opacity .1s, transform .1s; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.3rem; color: #2a2a2a; }
.pad.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 22px rgba(255,255,255,.8); }
.pad:disabled { cursor: default; }
.bush { position: absolute; bottom: 12%; width: 28%; height: 34%; margin-left: -14%; border: 0; padding: 0; background: none; cursor: pointer; transition-property: left; transition-timing-function: ease-in-out; }
.bush:disabled { cursor: default; }
.peek { position: absolute; width: 18%; height: 18%; margin-left: -9%; bottom: 36%; pointer-events: none; }
.gamemsg { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 6px 12px; font-weight: 800; white-space: nowrap; z-index: 7; }

.foot { text-align: center; color: var(--muted); font-size: .8rem; font-weight: 700; margin: 0; }
@media (max-width: 380px) { .act span { font-size: .7rem; } h1 { font-size: 1.5rem; } .moodrow button { font-size: .72rem; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="device" id="device">
  <header>
    <div class="who">
      <h1 id="name">A mystery egg</h1>
      <span class="age" id="age">Waiting to hatch</span>
    </div>
    <div class="chips">
      <span class="mood" id="mood">Snug</span>
      <span class="acorns" aria-label="Acorns"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10c0-3 3-5 7-5s7 2 7 5z" fill="#8a5a2b"/><path d="M12 5V2.5" stroke="#8a5a2b" stroke-width="2" stroke-linecap="round"/><path d="M6 10h12c0 6-3 11-6 11s-6-5-6-11z" fill="#d49a52"/></svg><span id="acornCount">0</span></span>
    </div>
  </header>

  <div class="scene day" id="scene">
    <div class="stars" id="stars"></div>
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="ground"></div>
    <div class="layer" id="decorBack"></div>
    <button class="pet st-egg" id="pet" type="button" aria-label="Your owl"></button>
    <div class="layer" id="decorFront"></div>
    <button class="gift" id="gift" type="button" aria-label="Open the gift" hidden></button>
    <div class="bubble" id="bubble">Tap me! Something's wiggling in here...</div>
    <div class="checkin" id="checkin" hidden></div>
  </div>

  <div class="meters">
    <div class="meter"><div class="top">Tummy <b id="v-full">80</b></div><div class="bar"><span id="b-full"></span></div></div>
    <div class="meter"><div class="top">Love <b id="v-love">80</b></div><div class="bar"><span id="b-love"></span></div></div>
    <div class="meter"><div class="top">Fun <b id="v-fun">80</b></div><div class="bar"><span id="b-fun"></span></div></div>
    <div class="meter"><div class="top">Energy <b id="v-energy">80</b></div><div class="bar"><span id="b-energy"></span></div></div>
  </div>

  <div class="actions">
    <button class="act" id="a-feed" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/></svg><span>Feed</span></button>
    <button class="act" id="a-pet" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>Cuddle</span></button>

function period(h = hourNow()) { return h >= 5 && h < 8 ? "dawn" : h >= 8 && h < 17 ? "day" : h >= 17 && h < 20 ? "dusk" : "night"; }

/* owl hours: owls tire in daylight and perk up at night */
function decay(t) {

/* ================= ui ================= */
let expression = null, exprTimer = null, playing = false, sheet = null;
function mood() {
  if (!S.hatched) return ["Snug", ""];
  if (S.asleep) return ["Dreaming", "sleep"];
  const low = Math.min(S.full, S.love, S.fun, S.energy);
  if (low < 25) {
    if (S.love === low) return ["Missing you", "sad"];
    if (S.full === low) return ["Peckish", "sad"];
    if (S.energy === low) return ["Sleepy", "sad"];
    return ["Bored", "sad"];
  }
  const p = period();
  if (p === "night") return ["Wide awake", ""];
  if (p === "dawn") return ["Drowsy", ""];
  return (S.full + S.love + S.fun + S.energy) / 4 > 75 ? ["Overjoyed", ""] : ["Content", ""];
}
function faceKind() {
  if (S.asleep) return "sleep";
  if (expression) return expression;
  return Math.min(S.full, S.love, S.fun, S.energy) < 25 ? "sad" : "open";
}
function stageLabel() {
  const st = stage();
  if (st === "owlet") return "Owlet";
  if (st === "fledgling") return "Fledgling";
  if (st === "adult") return S.path ? PATHS[S.path] : "Grown owl";

}
function ageText() {
  if (!S.hatched) return "Waiting to hatch";
  const m = (now() - S.born) / 60000;
  let a;
  if (m < 2) a = "hatched just now";
  else if (m < 60) a = `${Math.round(m)} min old`;
  else if (m < 1440) { const h = Math.round(m / 60); a = `${h} hour${h > 1 ? "s" : ""} old`; }
  else { const d = Math.floor(m / 1440); a = `${d} day${d > 1 ? "s" : ""} old`; }
  return `${stageLabel()} · ${a}`;
}
function drawPet() {
  const p = $("pet"), st = stage();
  p.className = "pet st-" + st;
  p.innerHTML = S.hatched ? owlSVG(faceKind()) : eggSVG();
}
function drawDecor() {
  const html = { back: "", front: "", rug: "" };
  S.decorOn.forEach(id => { const d = DECOR_ART[id]; if (d) html[d.layer] += `<div class="decor${d.glow ? " glow" : ""}" style="${d.style}">${d.svg}</div>`; });

}
function render() {

  $("acornCount").textContent = S.acorns;

  }

function say(t) { if (!$("checkin").hidden) return; const b = $("bubble"); b.textContent = t; b.hidden = false; b.classList.remove("fresh"); void b.offsetWidth; b.classList.add("fresh"); }

/* growth: stage changes, path choice, weekly birthdays */
function growthCheck() {
  if (!S.hatched) return;
  const st = stage(), order = ["egg", "owlet", "fledgling", "adult", "wise"];
  if (order.indexOf(st) > order.indexOf(S.stageSeen)) {
    S.stageSeen = st;
    if ((st === "adult" || st === "wise") && !S.path) { S.path = topLean(); remember("path", `${S.name} became a ${PATHS[S.path]}`, "grow"); }
    const msg = { fledgling: `${S.name} grew into a fledgling`, adult: `${S.name} is all grown up`, wise: `${S.name} became a wise old owl` }[st];
    if (msg) remember("stage-" + st, msg, "grow");
    const line = { fledgling: "Look! My first grown-up feather! I'm a fledgling now!", adult: `I'm all grown up! I think I'm a ${PATHS[S.path]}. That's because of you.`, wise: "I'm a wise old owl now. My wisdom: you are loved. Hoo." }[st];
    if (line) setTimeout(() => celebrate(line, 6), 400);
    save();
  }
  const w = Math.floor(ageDays() / 7);
  if (w >= 1) remember("week-" + w, `${S.name} turned ${w} week${w > 1 ? "s" : ""} old`, "grow");
}

/* ================= care actions ================= */
function hatch() {
  S.taps++;
  $("pet").querySelector(".egg")?.animate([{ transform: "rotate(-10deg)" }, { transform: "rotate(10deg)" }, { transform: "rotate(0)" }], { duration: 350 });
  tone(300 + S.taps * 80, .1, "triangle", .08); buzz(15);
  if (S.taps < 3) { say(S.taps === 1 ? "Crack! Keep going..." : "Almost there! One more!"); drawPet(); save(); return; }
  S.hatched = true; S.name = pick(NAMES); S.born = now(); S.last = now(); S.stageSeen = "owlet";
  S.full = 70; S.love = 90; S.fun = 75; S.energy = 85; S.fav = rollFavs();
  remember("hatch", `${S.name} hatched and chose their name`, "grow");
  save(); render();
  celebrate(`Hoo! Hi! I'm ${S.name}! Are you my person? I think you're my person.`, 6);
}
function pet() {
  if (!S.hatched) return hatch();
  if (S.asleep) { say("Zzz... (it snuggles closer in its sleep)"); return; }
  S.love = clamp(S.love + 9); S.fun = clamp(S.fun + 2); S.counts.cuddles++;
  if (S.counts.cuddles === 1) remember("cuddle1", "First cuddle", "love");
  if (S.counts.cuddles === 100) remember("cuddle100", "100 cuddles!", "love");
  $("owlbody")?.classList.add("wiggle"); setTimeout(() => $("owlbody")?.classList.remove("wiggle"), 600);
  express("happy"); hearts(); flap(); hoot(); buzz(12); say(pick(LINES.pet)); save(); render();
}
function feed(s) {
  closeSheet();
  if (S.full > 92) { express("open"); say(pick(LINES.full)); return; }
  if (s.cost > S.acorns) { say(`I'd love ${s.name.toLowerCase()}, but we need ${s.cost - S.acorns} more acorns.`); return; }
  S.acorns -= s.cost; S.counts.feeds++;
  const fav = S.fav && S.fav.snack === s.id, yuck = S.fav && S.fav.yuck === s.id;
  const m = yuck ? 0.4 : fav ? 1.3 : 1;
  S.full = clamp(S.full + s.full * (yuck ? 0.6 : 1)); S.love = clamp(S.love + (s.love || 0) * m + (fav ? 6 : 0));
  S.fun = clamp(S.fun + (s.fun || 0)); S.energy = clamp(S.energy + (s.energy || 0));
  if (S.counts.feeds === 1) remember("feed1", "First meal together", "love");
  if (yuck) {
    express("sad", 1800); boop();
    if (!S.found.yuck) { S.found.yuck = true; remember("yuck", `Found out ${S.name} doesn't like ${s.name.toLowerCase()}`, "love"); say(`Blegh! I don't think I like ${s.name.toLowerCase()}. Sorry! I still love you.`); }
    else say(`Oh... ${s.name.toLowerCase()} again? I'll eat a little. For you.`);
  } else if (fav) {
    express("happy", 2200); hearts(5); flap(); chime();
    if (!S.found.snack) { S.found.snack = true; remember("fav", `Discovered ${S.name}'s favorite food: ${s.name.toLowerCase()}`, "love"); say(`Oh. Oh my. ${s.name} is my FAVORITE thing in the whole world!`); }
    else say(`${s.name}! My favorite! You remembered!`);
  } else { express("happy"); flap(); say(s.say); }
  save(); render();
}
function toggleSleep() {
  closeSheet(); closeCheckin();
  S.asleep = !S.asleep;
  if (S.asleep) {
    S.counts.sleeps++;
    if (S.counts.sleeps === 1) remember("sleep1", "First time tucked in", "love");
    say(S.love < 50 ? "Will you be here when I wake up? ...okay. Night night." : period() === "day" ? "A daytime nap! Very owl of us. Night night." : "Night night. Thank you for today.");
  } else { express("happy", 2000); say(S.energy > 70 ? "Good morning! I dreamed about you." : "Five more minutes... okay, I'm up. Hi!"); }
  save(); render();
}
function setOutfit(o) {

  } else {

/* daily check-in */
function closeCheckin() { $("checkin").hidden = true; }
function maybeCheckin(force) {
  if (!S.hatched || S.asleep || playing || sheet || !$("checkin").hidden) return;
  if (!force && (S.lastCheck === dayKey(now()) || now() - S.born < 10 * 60000)) return;
  const c = $("checkin");
  c.innerHTML = `<p>${pick(["How was your day?", "How are you feeling today?", "Tell me about your day?"])}</p><div class="moodrow">${MOODS.map(m => `<button type="button" data-m="${m.id}"><i style="background:${m.c}"></i>${m.name}</button>`).join("")}</div>`;

}

const roughLately = () => S.moods.slice(-3).filter(x => x.m === "rough" || x.m === "meh").length >= 2;

/* ================= sheets ================= */

function openDress() {

async function gameHoots() {
  const g = gameShell(true);

  const wrap = document.createElement("div"); wrap.className = "pads";

  g.appendChild(wrap);
  const light = async (i, ms) => { btns[i].classList.add("lit"); tone(pads[i][1], ms / 1000, "sine", .15, .92); await sleep(ms); btns[i].classList.remove("lit"); };
  const seq = []; let round = 0;
  const setHud = (a, b) => { $("gs").textContent = a; $("gt").textContent = b; };
  while (true) {
    seq.push(Math.floor(Math.random() * 4)); round = seq.length;
    setHud("Round " + round, "Listen..."); btns.forEach(b => b.disabled = true);
    await sleep(650);
    const speed = Math.max(260, 520 - round * 25);
    for (const i of seq) { await light(i, speed); await sleep(110); }
    setHud("Round " + round, "Your turn");
    btns.forEach(b => b.disabled = false);
    const ok = await new Promise(res => {
      let idx = 0;
      btns.forEach((b, i) => b.onclick = () => {
        light(i, 220); buzz(6);
        if (i !== seq[idx]) { btns.forEach(x => x.onclick = null); res(false); return; }
        idx++; if (idx === seq.length) { btns.forEach(x => x.onclick = null); res(true); }
      });
    });
    if (!ok) { boop(); buzz(60); await sleep(500); break; }
    if (round >= 15) break;
    await sleep(350);
  }
  const done = seq.length - 1 + (seq.length >= 15 ? 1 : 0);
  endGame("hoots", g, done, done * 2, done >= 8 ? `${done} hoots in a row! What a memory!` : done >= 4 ? `${done} hoots! We're a duet!` : `${done} hoots. Hooting with you is my favorite noise.`);
}
function gameMoths() {

  let px = W() / 2, target = px;

      } else if (m.y > h) { m.el.remove(); moths.splice(i, 1); }
    }

  };

  const tick = setInterval(() => {
    left--; $("gt").textContent = "0:" + String(left).padStart(2, "0");
    if (left <= 0) { alive = false; clearInterval(spawn); clearInterval(tick); endGame("moths", g, score, Math.ceil(score / 2), score >= 18 ? `${score} moths! I'm stuffed and proud!` : `We caught ${score} moths! Crunchy teamwork.`); }

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") arrive(false); });
</script>
